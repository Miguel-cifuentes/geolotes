server:
  port: 8081
  tomcat:
    max-swallow-size: -1   # deja que Spring responda 413 si el video es muy grande

spring:
  application:
    name: lotes-service
  datasource:
    url: jdbc:postgresql://${LOTES_DB_HOST:localhost}:${LOTES_DB_PORT:5434}/lotes_db
    # Spring no lee el .env; estos valores por defecto deben coincidir con tu .env
    username: ${POSTGRES_USER:geolotes}
    password: ${POSTGRES_PASSWORD:geolotes123}
  jpa:
    hibernate:
      ddl-auto: none   # la tabla la crea schema.sql (Hibernate no maneja columnas geometry)
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 300MB      # videos de los lotes
      max-request-size: 300MB
  sql:
    init:
      mode: always     # ejecuta schema.sql y data.sql en cada arranque
      encoding: UTF-8

springdoc:
  swagger-ui:
    path: /swagger-ui.html


geolotes:
  videos:
    carpeta: ${VIDEOS_DIR:videos}       # carpeta donde se guardan los videos de los lotes
  auth:
    # Firma de los tokens: el MISMO valor en lotes-service y visitas-service, mínimo 32 caracteres
    secreto: ${JWT_SECRETO:geolotes-secreto-de-desarrollo-cambiar-en-produccion}
    duracion-horas: 8                   # la sesión del vendedor dura una jornada
  vendedor:                             # cuenta que se crea al primer arranque
    usuario: ${VENDEDOR_USUARIO:vendedor}
    nombre: ${VENDEDOR_NOMBRE:Vendedor La Porfía}
    clave: ${VENDEDOR_CLAVE:LaPorfia2026}
