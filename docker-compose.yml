services:
  visitas-db:
    image: postgres:16
    container_name: geolotes-visitas-db
    environment:
      POSTGRES_DB: visitas_db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"   # 5433 en tu PC, para no chocar con la base de David (5432)
    volumes:
      - visitas-data:/var/lib/postgresql/data

volumes:
  visitas-data: